[options]
; Thư mục chứa các module Odoo (mặc định + custom)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Nơi lưu trữ dữ liệu tệp tin, sessions của Odoo
data_dir = /var/lib/odoo

; Proxy mode là BẮT BUỘC khi chạy sau Nginx (để nhận đúng IP khách và giao thức HTTPS)
proxy_mode = True

; --- CẤU HÌNH HIỆU NĂNG (Dành cho Staging/Production) ---
; Bật multi-processing bằng cách set workers > 0.
; Công thức đề xuất: (Số CPU * 2) + 1. Ví dụ VPS 1 CPU -> workers = 2 hoặc 3.
workers = 2

; Cổng cho các kết nối HTTP thông thường
xmlrpc_port = 8069

; Cổng cho các kết nối real-time chat/notification (longpolling)
longpolling_port = 8072

; Giới hạn tài nguyên để tránh treo server
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

