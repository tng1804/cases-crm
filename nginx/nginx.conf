# Cấu hình Nginx Reverse Proxy cho Odoo (Hỗ trợ Workers & Longpolling)

# Định nghĩa upstream cho Odoo Web Server (cổng 8069)
upstream odoo-web {
    server odoo:8069;
}

# Định nghĩa upstream cho Odoo Longpolling (cổng 8072)
upstream odoo-im {
    server odoo:8072;
}

server {
    listen 80;
    server_name localhost; # Thay thế bằng domain của bạn khi cấu hình staging (ví dụ: staging.yourdomain.com)

    # Tăng kích thước file upload tối đa (Database backup, attachments...)
    client_max_body_size 100M;

    # Cấu hình Gzip để nén dữ liệu truyền tải
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip_min_length 1000;

    # Proxy Headers chung
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Định tuyến cho tính năng Chat Real-time & Notifications (Longpolling)
    location /longpolling {
        proxy_pass http://odoo-im;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_redirect off;
    }

    # Định tuyến các request thông thường
    location / {
        proxy_pass http://odoo-web;
        # Hỗ trợ chuyển đổi giao thức HTTP/1.1 (Cần thiết cho websockets nếu có)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # Cache static files (CSS, JS, Images) để giảm tải cho Odoo
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 8d;
        proxy_pass http://odoo-web;
    }
}
