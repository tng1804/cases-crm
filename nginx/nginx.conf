# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY CHO ODOO (CHO VPS - CHẠY NGOÀI DOCKER)
# Đường dẫn mẫu trên Ubuntu/Debian: /etc/nginx/sites-available/odoo
# ==============================================================================

# 1. Định nghĩa các Upstream trỏ đến các cổng Odoo container đã expose ra host
upstream odoo-web-upstream {
    server 127.0.0.1:8069;
}

upstream odoo-im-upstream {
    server 127.0.0.1:8072;
}

# 2. CẤU HÌNH HTTP (Redirect toàn bộ sang HTTPS)
server {
    listen 80;
    server_name staging.yourdomain.com; # Thay thế bằng domain staging thực tế của bạn

    # Phục vụ xác thực tự động Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. CẤU HÌNH HTTPS (Bảo mật SSL)
server {
    listen 443 ssl http2;
    server_name staging.yourdomain.com; # Thay thế bằng domain staging thực tế của bạn

    # Đường dẫn file chứng chỉ SSL (Certbot sẽ tự sinh ra ở đây)
    ssl_certificate /etc/letsencrypt/live/staging.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.yourdomain.com/privkey.pem;

    # Cấu hình bảo mật SSL tối ưu
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets off;

    # Log files
    access_log /var/log/nginx/odoo.access.log;
    error_log /var/log/nginx/odoo.error.log;

    # Tăng dung lượng tối đa cho file upload (Database backup, import tài liệu...)
    client_max_body_size 100M;

    # Cấu hình nén Gzip tăng tốc độ tải trang
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    gzip_min_length 1000;

    # Thiết lập timeout cho các request nặng (ví dụ cài đặt ứng dụng, restore database)
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Các Header chuyển tiếp bắt buộc cho Odoo Proxy Mode
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Định tuyến Chat Real-time & Live Chat (Longpolling)
    location /longpolling {
        proxy_pass http://odoo-im-upstream;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_redirect off;
    }

    # Định tuyến các request thông thường đến Web server Odoo
    location / {
        proxy_pass http://odoo-web-upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # Cấu hình bộ nhớ đệm (Cache) cho file tĩnh của Odoo nhằm giảm tải cho server
    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 8d;
        proxy_pass http://odoo-web-upstream;
    }
}
